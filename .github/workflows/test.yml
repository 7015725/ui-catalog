name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 语法检查
        run: node scripts/check.mjs

      - name: 安装无头浏览器
        run: |
          npm i --no-save --package-lock=false playwright@1.63.0 @axe-core/playwright@4.14.0
          npx playwright install --with-deps chromium

      - name: 启动开发服务器
        run: |
          node dev-server.mjs --no-watch > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5173/ > /dev/null && break; sleep 1; done

      - name: 回归测试（test.html）
        run: node scripts/run-tests.mjs

      - name: 液态玻璃模板的字面代码独立运行
        run: npm run test:liquid

      - name: 验收脚本负例与真实出口回归
        run: npm run test:guards

      - name: 系统 APP 画廊与响应式回归
        run: npm run test:mobile

      - name: 全风格无障碍与屏宽矩阵
        run: npm run test:a11y
