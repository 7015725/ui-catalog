<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-style="aurora">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI 组件库 · 回归测试</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="stylesheet" href="./src/styles/tokens.css">
<style>
  body{
    margin:0;padding:22px 18px 60px;
    background:var(--ui-bg);color:var(--ui-text);
    font-family:var(--ui-font);-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:860px;margin:0 auto}
  header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
    padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--ui-line)}
  h1{margin:0;font-size:16px}
  .sub{margin:2px 0 0;font-size:12px;color:var(--ui-sub)}
  .stat{display:flex;gap:10px;align-items:center;font-size:13px}
  .pill{padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
  .pill.ok{background:var(--ui-ok-soft);color:var(--ui-ok)}
  .pill.bad{background:var(--ui-danger-soft);color:var(--ui-danger)}
  .pill.sum{background:var(--ui-brand-soft);color:var(--ui-brand)}
  .reload{font:inherit;font-size:12.5px;padding:7px 12px;cursor:pointer;
    border:1px solid var(--ui-line);border-radius:var(--ui-radius);background:var(--ui-panel);color:var(--ui-sub)}
  .reload:hover{border-color:var(--ui-brand);color:var(--ui-brand)}
  h2{font-size:12px;letter-spacing:.08em;color:var(--ui-sub);margin:20px 0 8px;text-transform:uppercase}
  .row{display:flex;gap:10px;align-items:flex-start;
    padding:9px 12px;border:1px solid var(--ui-line);border-radius:var(--ui-radius);
    background:var(--ui-panel);margin-bottom:6px;font-size:13px}
  .row .mark{flex:0 0 auto;width:18px;text-align:center;font-weight:700}
  .row.pass .mark{color:var(--ui-ok)}
  .row.fail{border-color:var(--ui-danger);background:var(--ui-danger-soft)}
  .row.fail .mark{color:var(--ui-danger)}
  .row .name{flex:1;min-width:0;line-height:1.6}
  .row .ms{flex:0 0 auto;font-size:11px;color:var(--ui-sub);font-variant-numeric:tabular-nums}
  .err{margin:4px 0 0;font-family:var(--ui-mono);font-size:11.5px;color:var(--ui-danger);word-break:break-word}
  .done{margin-top:18px;font-size:12.5px;color:var(--ui-sub)}
  .done b{color:var(--ui-text)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>回归测试</h1>
      <p class="sub">原生断言 · 无框架 · 每条用例独立沙箱</p>
    </div>
    <div class="stat">
      <span class="pill sum" id="progress">运行中…</span>
      <span class="pill ok" id="pass">0 通过</span>
      <span class="pill bad" id="fail">0 失败</span>
      <button class="reload" onclick="location.reload()">重跑</button>
    </div>
  </header>
  <div id="list"></div>
  <p class="done" id="done" hidden></p>
</div>

<script type="module">
import { run } from './src/test/harness.js';
import './src/test/cases.js';
import './src/test/cases-shell.js';

const list = document.getElementById('list');
const elPass = document.getElementById('pass');
const elFail = document.getElementById('fail');
const elProgress = document.getElementById('progress');
const elDone = document.getElementById('done');

const suiteEls = {};
let pass = 0;
let fail = 0;
let total = 0;
const t0 = performance.now();

function suiteNode(name) {
  if (suiteEls[name]) return suiteEls[name];
  const h = document.createElement('h2');
  h.textContent = name;
  list.appendChild(h);
  const box = document.createElement('div');
  list.appendChild(box);
  suiteEls[name] = box;
  return box;
}

function addRow(r) {
  total++;
  if (r.ok) pass++; else fail++;
  elPass.textContent = pass + ' 通过';
  elFail.textContent = fail + ' 失败';
  elProgress.textContent = '共 ' + total + ' 项';

  const row = document.createElement('div');
  row.className = 'row ' + (r.ok ? 'pass' : 'fail');
  row.innerHTML =
    '<span class="mark">' + (r.ok ? '✓' : '✕') + '</span>' +
    '<span class="name">' + r.name + (r.ok ? '' :
      '<p class="err">' + String(r.error).replace(/[&<>]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
      }) + '</p>') + '</span>' +
    '<span class="ms">' + r.ms + 'ms</span>';
  suiteNode(r.suite).appendChild(row);
}

await run(addRow);

const ms = Math.round(performance.now() - t0);
elDone.hidden = false;
elDone.innerHTML = fail === 0
  ? '<b>全部通过</b> · ' + pass + ' 项 · 耗时 ' + ms + 'ms'
  : '<b>' + fail + ' 项失败</b> · 通过 ' + pass + ' 项 · 耗时 ' + ms + 'ms';
elProgress.textContent = fail === 0 ? '全部通过' : '有失败项';
elProgress.className = 'pill ' + (fail === 0 ? 'ok' : 'bad');

window.__testResult = { pass: pass, fail: fail, total: total, ms: ms };
</script>
</body>
</html>
